name: Upload logs
description: Upload logs from `make docker-compose` devel environment to GitHub as an artifact
inputs:
  log-filename:
    description: "*Unique* name of the log file"
    required: true
runs:
  using: composite
  steps:
    - name: Get AWX logs
      shell: bash
      run: |
        if docker inspect tools_awx_1 > /dev/null 2>&1; then
          docker logs tools_awx_1 > ${{ inputs.log-filename }}
        else
          echo "Container tools_awx_1 not found or not accessible" > ${{ inputs.log-filename }}
          echo "Available containers:" >> ${{ inputs.log-filename }}
          docker ps -a >> ${{ inputs.log-filename }}
        fi

    - name: Upload AWX logs as artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-compose-logs-${{ inputs.log-filename }}
        path: ${{ inputs.log-filename }}
