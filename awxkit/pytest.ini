# This file prevents pytest from walking up to the root pytest.ini,
# which contains Django-specific warning filters that are not resolvable
# in the awxkit tox environment (Django is not installed there).
#
# The settings below mirror the [pytest] section in awxkit/tox.ini.
# testpaths restricts collection to only the awxkit tests, preventing
# pytest from discovering tests in sibling directories (awx/, awx_collection/)
# that require Django and other packages not available in this tox env.
[pytest]
addopts = -v --tb=native
testpaths = test
python_files = test_*.py

filterwarnings =
  error

junit_family=xunit2
